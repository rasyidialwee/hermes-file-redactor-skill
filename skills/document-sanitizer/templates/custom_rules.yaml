# Example custom rules for document sanitization
# Use: sanitize.py PATH --custom-rules this-file

custom_rules:
  - name: customer_id
    pattern: "CUS-[0-9]{6}"
    replacement: "[CUSTOMER_ID]"

  - name: project_code
    pattern: "ZEE-[A-Z0-9-]+"
    replacement: "[PROJECT_ID]"

  # Names with BIN/BINTI are redacted automatically in pii mode as [NAME_001].
  # List exact names without those markers here:
  - name: person
    pattern: "John Smith|Alice Tan"
    replacement: "[NAME]"

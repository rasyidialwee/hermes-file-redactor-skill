[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-file-redactor"
version = "0.1.0"
description = "Local deterministic document sanitizer for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "rasyidialwee" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
ocr = ["Pillow>=10.0", "pytesseract>=0.3.10"]
all = ["pypdf>=4.0", "Pillow>=10.0", "pytesseract>=0.3.10"]
dev = ["pytest>=8.0", "pypdf>=4.0", "Pillow>=10.0"]

[project.scripts]
document-sanitize = "document_sanitizer.cli:main"

[tool.setuptools.packages.find]
where = ["skills/document-sanitizer/scripts"]
include = ["document_sanitizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/document-sanitizer/scripts"]
